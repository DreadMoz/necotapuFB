<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>3種類認証テスト - necotapuFB</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, OAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        // Firebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyAlz5pYr-M5MzY_es94f2zNphBBMiJ5TXs",
            authDomain: "necotapufb.firebaseapp.com",
            projectId: "necotapufb",
            storageBucket: "necotapufb.firebasestorage.app",
            messagingSenderId: "794942101336",
            appId: "1:794942101336:web:e244937b77bb056a43772d",
            databaseURL: "https://necotapufb.firebaseio.com"
        };
        
        // Firebase初期化
        let app = null;
        let auth = null;
        
        // テスト用UI
        let logArea = document.getElementById('logArea');
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `[${timestamp}] ${message}`;
            logArea.appendChild(logEntry);
            logArea.scrollTop = logArea.scrollHeight;
            console.log(`[AuthThreeMethods] ${message}`);
        }
        
        function clearLogs() {
            logArea.innerHTML = '';
            addLog("ログをクリアしました");
        }
        
        function initializeFirebase() {
            try {
                addLog("Firebase初期化開始...");
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                addLog("Firebase初期化成功");
                
                // 認証状態の変更を監視
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        addLog(`✅ 認証状態確認: ${user.uid}`);
                        addLog(`   メール: ${user.email || 'なし'}`);
                        addLog(`   表示名: ${user.displayName || 'なし'}`);
                        addLog(`   プロバイダー: ${user.providerData[0]?.providerId || 'anonymous'}`);
                        addLog(`   匿名ユーザー: ${user.isAnonymous}`);
                    } else {
                        addLog("ℹ️ 未認証状態です");
                    }
                });
                
                return true;
            } catch (error) {
                addLog(`Firebase初期化失敗: ${error.message}`);
                return false;
            }
        }
        
        // Google認証
        window.testGoogleAuth = function() {
            addLog("=== Google認証テスト開始 ===");
            
            if (!auth) {
                addLog("エラー: Firebase Auth not initialized");
                return;
            }
            
            const provider = new GoogleAuthProvider();
            addLog("GoogleAuthProvider作成完了");
            
            signInWithPopup(auth, provider)
                .then((result) => {
                    addLog(`✅ Google認証成功: ${result.user.uid}`);
                    addLog(`   メール: ${result.user.email}`);
                    addLog(`   表示名: ${result.user.displayName}`);
                    addLog(`   プロバイダー: ${result.providerId}`);
                })
                .catch((error) => {
                    addLog(`❌ Google認証失敗: ${error.message}`);
                    addLog(`   エラーコード: ${error.code}`);
                });
        };
        
        // Microsoft認証
        window.testMicrosoftAuth = function() {
            addLog("=== Microsoft認証テスト開始 ===");
            
            if (!auth) {
                addLog("エラー: Firebase Auth not initialized");
                return;
            }
            
            const provider = new OAuthProvider('microsoft.com');
            addLog("MicrosoftAuthProvider作成完了");
            
            signInWithPopup(auth, provider)
                .then((result) => {
                    addLog(`✅ Microsoft認証成功: ${result.user.uid}`);
                    addLog(`   メール: ${result.user.email}`);
                    addLog(`   表示名: ${result.user.displayName}`);
                    addLog(`   プロバイダー: ${result.providerId}`);
                })
                .catch((error) => {
                    addLog(`❌ Microsoft認証失敗: ${error.message}`);
                    addLog(`   エラーコード: ${error.code}`);
                });
        };
        
        // ゲスト認証
        window.testGuestAuth = function() {
            addLog("=== ゲスト認証テスト開始 ===");
            
            if (!auth) {
                addLog("エラー: Firebase Auth not initialized");
                return;
            }
            
            signInAnonymously(auth)
                .then((result) => {
                    addLog(`✅ ゲスト認証成功: ${result.user.uid}`);
                    addLog(`   匿名ユーザー: ${result.user.isAnonymous}`);
                })
                .catch((error) => {
                    addLog(`❌ ゲスト認証失敗: ${error.message}`);
                });
        };
        
        // ログアウト
        window.logout = function() {
            addLog("=== ログアウト開始 ===");
            
            if (!auth) {
                addLog("エラー: Firebase Auth not initialized");
                return;
            }
            
            signOut(auth)
                .then(() => {
                    addLog("✅ ログアウト成功");
                })
                .catch((error) => {
                    addLog(`❌ ログアウト失敗: ${error.message}`);
                });
        };
        
        window.clearLog = function() {
            clearLogs();
        };
        
        // 初期化
        window.addEventListener('load', function() {
            addLog("3種類認証テストページ読み込み完了");
            
            if (initializeFirebase()) {
                addLog("Firebase初期化完了");
                addLog("3種類の認証が利用可能です");
            } else {
                addLog("Firebase初期化失敗");
            }
        });
    </script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        h1 {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
        
        .test-buttons {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .test-button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        
        .google-btn {
            background: linear-gradient(45deg, #4285F4, #34A853);
            color: white;
        }
        
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 133, 244, 0.4);
        }
        
        .microsoft-btn {
            background: linear-gradient(45deg, #00A4EF, #0078D4);
            color: white;
        }
        
        .microsoft-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 164, 239, 0.4);
        }
        
        .guest-btn {
            background: linear-gradient(45deg, #FF9800, #F57C00);
            color: white;
        }
        
        .guest-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }
        
        .logout-btn {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }
        
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }
        
        .clear-btn {
            background: linear-gradient(45deg, #636e72, #2d3436);
            color: white;
        }
        
        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 110, 114, 0.4);
        }
        
        .log-container {
            margin: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        #logArea {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        
        #logArea div {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        
        .info-box {
            margin: 20px;
            padding: 15px;
            background: #e8f5e8;
            border-radius: 5px;
            border-left: 4px solid #4CAF50;
        }
        
        .info-box h3 {
            margin-top: 0;
            color: #2E7D32;
        }
        
        .info-box ul {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 3種類認証テスト - necotapuFB</h1>
        
        <div class="test-buttons">
            <button class="test-button google-btn" onclick="testGoogleAuth()">
                🔐 Googleでログイン
            </button>
            <button class="test-button microsoft-btn" onclick="testMicrosoftAuth()">
                🔐 Microsoftでログイン
            </button>
            <button class="test-button guest-btn" onclick="testGuestAuth()">
                👤 ゲストログイン
            </button>
            <button class="test-button logout-btn" onclick="logout()">
                🚪 ログアウト
            </button>
            <button class="test-button clear-btn" onclick="clearLog()">
                🗑️ ログクリア
            </button>
        </div>
        
        <div class="log-container">
            <div id="logArea"></div>
        </div>
        
        <div class="info-box">
            <h3>🎯 テスト手順</h3>
            <ol>
                <li><strong>Googleでログイン</strong>ボタンをクリック</li>
                <li><strong>Microsoftでログイン</strong>ボタンをクリック</li>
                <li><strong>ゲストログイン</strong>ボタンをクリック</li>
                <li><strong>ログアウト</strong>でテスト</li>
            </ol>
            
            <h3>📝 認証方法</h3>
            <ul>
                <li><strong>Google認証</strong>: Googleアカウントでログイン</li>
                <li><strong>Microsoft認証</strong>: Microsoftアカウントでログイン</li>
                <li><strong>ゲスト認証</strong>: 匿名でログイン</li>
            </ul>
        </div>
    </div>
</body>
</html>
