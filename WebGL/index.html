<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | typingWorld</title>
    <link rel="shortcut icon" href="https://dreadmoz.github.io/necotapuFB/WebGL/favicon.ico">
    <link rel="stylesheet" href="https://dreadmoz.github.io/necotapuFB/WebGL/style.css">
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1366 height=768></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
        </div>
    </div>

    <script type="module">// Import the functions you need from the SDKs you need
        var userInfo = null;
        let myGameInstance = null; // グローバルスコープで定義

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
//        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
          function updateBannerVisibility() {
              warningBanner.style.display = warningBanner.children.length ? "block" : "none";
          }
          var div = document.createElement("div");
          div.innerHTML = msg;
          warningBanner.appendChild(div);
          if (type == "error") div.style = "background: red; padding: 10px;";
          else {
              if (type == "warning") div.style = "background: yellow; padding: 10px;";
              setTimeout(function () {
                  warningBanner.removeChild(div);
                  updateBannerVisibility();
              }, 5000);
          }
          updateBannerVisibility();
        }

        //ウインドウサイズに合わせキャンバスサイズを変更
        function fitWindowCanvasSize(){
          
          var winHeight = window.innerHeight;
          const isViewUnderBar = false;  //falseにすると下部のバーが画面外に表示
          if (isViewUnderBar){
            const barHeight = 18*2;            //下部のバーサイズ
            const barHeightMargin = 10*2;      //下部の追加余白サイズ
            winHeight = winHeight - barHeight - barHeightMargin;
          }
          const winWidth = window.innerWidth;
          const appWidth = "1366";
          const appHeight = "768";
          const scale = Math.min((winWidth / appWidth), (winHeight / appHeight));
          const fixWidth = (appWidth * scale);
          const fixHeight = (appHeight * scale);

          canvas.style.width = fixWidth + 'px';
          canvas.style.height = fixHeight + 'px';
        }
        //ウインドウのリサイズ時の処理
        function windowResizeEvent(){
          var timeoutId = 0;
          const resizeDelay = 300;  //リサイズが完了したと判断する時間
          window.onresize = () => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(()=>{
              //リサイズ終了時の処理
              fitWindowCanvasSize();
            }, resizeDelay);
          };
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
          dataUrl: buildUrl + "/WebGL.data",
          frameworkUrl: buildUrl + "/WebGL.framework.js",
          codeUrl: buildUrl + "/WebGL.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "TestingGAS",
          productVersion: "1.1.7",
          showBanner: unityShowBanner,
        };
        
        function checkVersionAndUpdate() {
          const localVersionKey = "userVersion"; // ローカルストレージに保存するキー
          const appVersion = config.productVersion; // `config` からバージョンを取得

          // ローカルストレージからバージョンを取得
          const localVersion = localStorage.getItem(localVersionKey);
          console.log(`アプリバージョン: ${appVersion}, ローカルバージョン: ${localVersion}`);

          // バージョンが一致している場合、何もしないで終了
          if (localVersion === appVersion) {
            console.log("バージョンが一致しています。キャッシュクリアは不要です。");
            loadUnity(); // Unityをロード
            return;
          }
          
          // ローカルバージョンが存在しないか、異なる場合の処理
          console.log("バージョンが異なる、または存在しません。キャッシュを削除して更新を実行します。");
          const dbName = "UnityCache"; // Unityが使用するIndexedDB名
          const request = indexedDB.deleteDatabase(dbName);

          request.onsuccess = function () {
            console.log("IndexedDBキャッシュを削除しました。");
            localStorage.setItem(localVersionKey, appVersion); // ローカルバージョンを更新
            loadUnity(); // Unityをロード
          };

          request.onerror = function (event) {
            console.error("IndexedDBキャッシュの削除に失敗しました: ", event);
            loadUnity(); // 削除失敗時もUnityをロード
          };

          request.onblocked = function () {
            console.warn("IndexedDBキャッシュの削除がブロックされました。他のタブでUnityが使用されている可能性があります。");
            loadUnity(); // ブロック時でもUnityをロード
          };
        }

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          // Mobile device style: fill the whole browser client area with the game canvas:

          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";

          unityShowBanner("WebGL builds are not supported on mobile devices.");
        } else {
          // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
          fitWindowCanvasSize();
        }
        loadingBar.style.display = "block";

        function loadUnity() {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
              myGameInstance = unityInstance;
              window.unityInstance = unityInstance; // Firebase認証用に追加
              loadingBar.style.display = "none";

//              fullscreenButton.onclick = () => {
//                  unityInstance.SetFullscreen(1);
//              };

          }).catch((message) => {
              alert(message);
          });
          windowResizeEvent();
        };
        document.body.appendChild(script);
        }
        // ページロード時にバージョンチェックを実行
        checkVersionAndUpdate();

        //######################################################
        // Firebase認証機能
        //######################################################
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, OAuthProvider, signInWithPopup, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyAlz5pYr-M5MzY_es94f2zNphBBMiJ5TXs",
            authDomain: "necotapufb.firebaseapp.com",
            projectId: "necotapufb",
            storageBucket: "necotapufb.firebasestorage.app",
            messagingSenderId: "794942101336",
            appId: "1:794942101336:web:e244937b77bb056a43772d",
            databaseURL: "https://necotapufb.firebaseio.com"
        };

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ログ出力関数
        function addLog(message) {
            console.log(`[${new Date().toLocaleTimeString()}] ${message}`);
        }

        // Unityから呼び出せる認証関数
        window.startGoogleAuthFromUnity = function() {
            addLog("=== UnityからGoogle認証開始 ===");
            
            if (!auth) {
                addLog("Firebase認証が初期化されていません");
                return;
            }
            
            const provider = new GoogleAuthProvider();
            addLog("GoogleAuthProvider作成完了");
            
            signInWithPopup(auth, provider)
                .then((result) => {
                    addLog("✅ Google認証成功");
                    addLog(`ユーザーID: ${result.user.uid}`);
                    addLog(`メールアドレス: ${result.user.email}`);
                    addLog(`表示名: ${result.user.displayName}`);
                    
                    // Unityに認証情報を送信
                    const authInfo = {
                        userId: result.user.uid,
                        email: result.user.email,
                        displayName: result.user.displayName,
                        authMethod: "Google",
                        isGuest: false,
                        authenticatedAt: new Date().toISOString()
                    };
                    
                    // Unityに認証情報を送信
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('AuthManager', 'OnAuthSuccess', JSON.stringify(authInfo));
                        addLog("認証情報をUnityに送信完了");
                    }
                })
                .catch((error) => {
                    addLog(`❌ Google認証失敗: ${error.message}`);
                });
        };

        // Unityから呼び出せるMicrosoft認証関数
        window.startMicrosoftAuthFromUnity = function() {
            addLog("=== UnityからMicrosoft認証開始 ===");
            
            if (!auth) {
                addLog("Firebase認証が初期化されていません");
                return;
            }
            
            const provider = new OAuthProvider('microsoft.com');
            addLog("MicrosoftAuthProvider作成完了");
            
            signInWithPopup(auth, provider)
                .then((result) => {
                    addLog("✅ Microsoft認証成功");
                    addLog(`ユーザーID: ${result.user.uid}`);
                    addLog(`メールアドレス: ${result.user.email}`);
                    addLog(`表示名: ${result.user.displayName}`);
                    
                    // Unityに認証情報を送信
                    const authInfo = {
                        userId: result.user.uid,
                        email: result.user.email,
                        displayName: result.user.displayName,
                        authMethod: "Microsoft",
                        isGuest: false,
                        authenticatedAt: new Date().toISOString()
                    };
                    
                    // Unityに認証情報を送信
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('AuthManager', 'OnAuthSuccess', JSON.stringify(authInfo));
                        addLog("認証情報をUnityに送信完了");
                    }
                })
                .catch((error) => {
                    addLog(`❌ Microsoft認証失敗: ${error.message}`);
                });
        };

        // Unityから呼び出せるゲスト認証関数
        window.startGuestAuthFromUnity = function() {
            addLog("=== Unityからゲスト認証開始 ===");
            
            if (!auth) {
                addLog("Firebase認証が初期化されていません");
                return;
            }
            
            signInAnonymously(auth)
                .then((result) => {
                    addLog("✅ ゲスト認証成功");
                    addLog(`ユーザーID: ${result.user.uid}`);
                    
                    // Unityに認証情報を送信
                    const authInfo = {
                        userId: result.user.uid,
                        email: "",
                        displayName: "ゲストユーザー",
                        authMethod: "Guest",
                        isGuest: true,
                        authenticatedAt: new Date().toISOString()
                    };
                    
                    // Unityに認証情報を送信
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('AuthManager', 'OnAuthSuccess', JSON.stringify(authInfo));
                        addLog("認証情報をUnityに送信完了");
                    }
                })
                .catch((error) => {
                    addLog(`❌ ゲスト認証失敗: ${error.message}`);
                });
        };

        // ページ読み込み時の処理
        document.addEventListener('DOMContentLoaded', function() {
            addLog("=== ページ読み込み開始 ===");
            addLog("Firebase設定完了");
            addLog("Unityからポップアップ認証システム準備完了");
        });
    </script>
</body>
</html>
