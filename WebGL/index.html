<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | typingWorld</title>
    <link rel="shortcut icon" href="https://dreadmoz.github.io/necotapuFB/WebGL/favicon.ico">
    <link rel="stylesheet" href="https://dreadmoz.github.io/necotapuFB/WebGL/style.css">
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1366 height=768></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
        </div>
    </div>

    <script type="module">// Import the functions you need from the SDKs you need
        var userInfo = null;
        let myGameInstance = null; // グローバルスコープで定義

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
//        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        /**
         * Unityの警告バナーを表示・管理する
         * @param {string} msg - 表示するメッセージ
         * @param {string} type - メッセージタイプ ('error', 'warning')
         */
        function unityShowBanner(msg, type) {
          function updateBannerVisibility() {
              warningBanner.style.display = warningBanner.children.length ? "block" : "none";
          }
          var div = document.createElement("div");
          div.innerHTML = msg;
          warningBanner.appendChild(div);
          if (type == "error") div.style = "background: red; padding: 10px;";
          else {
              if (type == "warning") div.style = "background: yellow; padding: 10px;";
              setTimeout(function () {
                  warningBanner.removeChild(div);
                  updateBannerVisibility();
              }, 5000);
          }
          updateBannerVisibility();
        }

        /**
         * ウィンドウサイズに合わせてUnityキャンバスのサイズを調整する
         * アスペクト比を保ちながら、ウィンドウ内に収まるようにスケーリング
         */
        function fitWindowCanvasSize(){
          
          var winHeight = window.innerHeight;
          const isViewUnderBar = false;  //falseにすると下部のバーが画面外に表示
          if (isViewUnderBar){
            const barHeight = 18*2;            //下部のバーサイズ
            const barHeightMargin = 10*2;      //下部の追加余白サイズ
            winHeight = winHeight - barHeight - barHeightMargin;
          }
          const winWidth = window.innerWidth;
          const appWidth = "1366";
          const appHeight = "768";
          const scale = Math.min((winWidth / appWidth), (winHeight / appHeight));
          const fixWidth = (appWidth * scale);
          const fixHeight = (appHeight * scale);

          canvas.style.width = fixWidth + 'px';
          canvas.style.height = fixHeight + 'px';
        }
        /**
         * ウィンドウリサイズ時のイベントハンドラーを設定
         * リサイズ完了後300msでキャンバスサイズを調整（パフォーマンス最適化）
         */
        function windowResizeEvent(){
          var timeoutId = 0;
          const resizeDelay = 300;  //リサイズが完了したと判断する時間
          window.onresize = () => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(()=>{
              //リサイズ終了時の処理
              fitWindowCanvasSize();
            }, resizeDelay);
          };
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
          dataUrl: buildUrl + "/WebGL.data.unityweb",
          frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
          codeUrl: buildUrl + "/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "TestingGAS",
          productVersion: "unset", // UnityのWebGLビルド設定から自動で取得できないため、明示的に設定
          showBanner: unityShowBanner,
        };
        
        /**
         * LocalStorageからデータを読み込む関数
         * @returns {Promise<Object>} LocalStorageから読み込まれたデータとロード元を示すフラグ
         */
        window.LoadDataFromLocal = function() {
            return new Promise((resolve) => {
                try {
                    const statusAccountKey = window.getAccountSpecificKey('statusData');
                    const storedStatusData = localStorage.getItem(statusAccountKey);
                    
                    const rankingAccountKey = window.getAccountSpecificKey('rankingData');
                    const storedRankingData = localStorage.getItem(rankingAccountKey);

                    const result = {
                        statusData: null,
                        rankingData: null,
                        source: 'local' // ロード元がLocalStorageであることを示すフラグ
                    };

                    if (storedStatusData) {
                        result.statusData = JSON.parse(storedStatusData);
                        console.log(`LocalStorageからステータスデータを読み込みました (${statusAccountKey}):`, result.statusData);
                    } else {
                        console.log(`LocalStorageにステータスデータが見つかりません (${statusAccountKey})`);
                    }

                    if (storedRankingData) {
                        result.rankingData = JSON.parse(storedRankingData);
                        // 既存のランキングデータが単一オブジェクトの場合、配列に変換
                        if (!Array.isArray(result.rankingData)) {
                            result.rankingData = [result.rankingData];
                            console.log("LocalStorageランキングデータを配列に変換しました。");
                        }
                        console.log(`LocalStorageからランキングデータを読み込みました (${rankingAccountKey}):`, result.rankingData);
                    } else {
                        console.log(`LocalStorageにランキングデータが見つかりません (${rankingAccountKey})`);
                    }

                    resolve(result);

                } catch (e) {
                    console.error("データの解析中にエラーが発生しました:", e);
                    resolve({ statusData: null, rankingData: null, source: 'local', error: e });
                }
            });
        };

        // ユーザーデータバージョン比較関数
        // 引数: localDataJson (JSON文字列), firebaseDataJson (JSON文字列)
        // 戻り値: "local" または "firebase"
        window.compareUserDataVersion = (localDataJson, firebaseDataJson) => {
            try {
                const local = JSON.parse(localDataJson);
                const firebase = JSON.parse(firebaseDataJson);

                // アイテム数をカウント
                let localItemCount = 0;
                if (local.Items) {
                    local.Items.forEach(item => {
                        if (item) localItemCount++;
                    });
                }

                let firebaseItemCount = 0;
                if (firebase.Items) {
                    firebase.Items.forEach(item => {
                        if (item) firebaseItemCount++;
                    });
                }

                console.log(`HTML バージョン比較: ローカルアイテム数=${localItemCount}, Firebaseアイテム数=${firebaseItemCount}`);

                // アイテム数で比較
                if (localItemCount > firebaseItemCount) {
                    console.log("HTML: ローカルデータの方が新しい（アイテム数が多い）");
                    return "local";
                } else if (localItemCount < firebaseItemCount) {
                    console.log("HTML: Firebaseデータの方が新しい（アイテム数が多い）");
                    return "firebase";
                }

                // アイテム数が同じ場合、ゴールド数で比較
                // Status[0]がゴールドに相当すると仮定
                const localGold = (local.Status && local.Status.length > 0) ? local.Status[0] : 0;
                const firebaseGold = (firebase.Status && firebase.Status.length > 0) ? firebase.Status[0] : 0;

                console.log(`HTML ユーザデータバージョン比較: ローカルゴールド=${localGold}, Firebaseゴールド=${firebaseGold}`);

                if (localGold > firebaseGold) {
                    console.log("HTML: ローカルデータの方が新しい（ゴールドが多い）");
                    return "local";
                } else if (localGold < firebaseGold) {
                    console.log("HTML: Firebaseデータの方が新しい（ゴールドが多い）");
                    return "firebase";
                }

                // 両方同じ場合はFirebaseを優先
                console.log("HTML: ユーザデータが同じ - Firebaseを優先");
                return "firebase";

            } catch (e) {
                console.error(`HTML ユーザデータバージョン比較中にエラーが発生: ${e.message}`);
                // エラーの場合はFirebaseを優先
                return "firebase";
            }
        };


        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          // Mobile device style: fill the whole browser client area with the game canvas:

          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";

          unityShowBanner("WebGL builds are not supported on mobile devices.");
        } else {
          // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
          fitWindowCanvasSize();
        }
        loadingBar.style.display = "block";

        /**
         * Unity WebGLアプリケーションをロードする
         * ローダースクリプトを動的に追加し、Unityインスタンスを作成
         */
        function loadUnity() {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
              myGameInstance = unityInstance;
              window.unityInstance = unityInstance; // Firebase認証用に追加
              loadingBar.style.display = "none";

//              fullscreenButton.onclick = () => {
//                  unityInstance.SetFullscreen(1);
//              };

          }).catch((message) => {
              alert(message);
          });
          windowResizeEvent();
        };
        document.body.appendChild(script);
        }
        // Unityを直接ロード
        loadUnity();

        //######################################################
        // Firebase認証機能
        //######################################################
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, OAuthProvider, signInWithPopup, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, serverTimestamp, query, orderBy, limit, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase設定（設定テンプレートから読み込み）
        let firebaseConfig = null;
        window.app = null;
        window.auth = null;
        let isProduction = false;

        /**
         * プロフィール画像を処理し、アニメーションGIFの場合は最初のフレームを静止画に変換します。
         * UnityがアニメーションGIFを直接読み込めない問題に対応。
         * @param {string} url - 元の画像URL
         * @returns {Promise<string|null>} 処理された画像URL（データURLまたは元のURL）、またはエラー時にnull
         */
        async function processPhotoURLForUnity(url) {
            if (!url) {
                return null;
            }

            try {
                // 画像をダウンロード
                const response = await fetch(url);
                const blob = await response.blob();
                
                // Content-TypeでGIFを判定
                if (blob.type === 'image/gif') {
                    console.log("アニメーションGIFを検出しました。最初のフレームを静止画に変換します。");
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            // PNGまたはJPEGに変換（透過を考慮しPNG優先）
                            const dataUrl = canvas.toDataURL('image/png'); 
                            resolve(dataUrl);
                        };
                        img.onerror = (e) => {
                            console.error("GIFのロードに失敗しました (Imageオブジェクト):", e);
                            resolve(url); // 変換失敗時は元のURLを返す
                        };
                        img.src = URL.createObjectURL(blob);
                    });
                } else {
                    return url; // GIFでなければそのままのURLを返す
                }
            } catch (error) {
                console.error("プロフィール画像の処理中にエラーが発生しました:", error);
                return url; // エラー時は元のURLを返す
            }
        }
        
        /**
         * ログメッセージをコンソールに出力する（タイムスタンプ付き）
         * @param {string} message - 出力するメッセージ
         */
        function addLog(message) {
            console.log(`[${new Date().toLocaleTimeString()}] ${message}`);
        }

        /**
         * アカウント固有のキーを生成
         * @param {string} baseKey - ベースとなるキー名
         * @returns {string} アカウント固有のキー
         */
        window.getAccountSpecificKey = function(baseKey) {
            var currentUser = null;
            if (typeof window.auth !== 'undefined' && window.auth.currentUser) {
                currentUser = window.auth.currentUser;
            }
            
            if (currentUser && currentUser.email) {
                // メールアドレスをキーに含める（特殊文字を除去）
                var emailKey = currentUser.email.replace(/[^a-zA-Z0-9]/g, '_');
                return baseKey + '_' + emailKey;
            } else {
                // ユーザーが認証されていない場合はデフォルトキー
                return baseKey + '_anonymous';
            }
        };

        /**
         * 一括データ読み込みの内部実装
         */
        window.loadAllDataFromFirestore = function() {
            console.log("Firebaseから一括データ読み込み開始");
            
            // ユーザデータ、ランキングデータ、アプリバージョンデータを全て取得するためのPromise.all
            Promise.all([
                typeof window.loadFirestoreUserData === 'function' ? window.loadFirestoreUserData() : Promise.resolve({ statusData: null, source: 'none' }),
                typeof window.getNecoRank === 'function' ? window.getNecoRank() : Promise.resolve([]),
                typeof window.checkAppVersion === 'function' ? window.checkAppVersion() : Promise.resolve(null)
            ])
            .then(([userDataResult, rankingList, versionInfo]) => {
                console.log("一括データ読み込み完了:", { userDataResult, rankingList, versionInfo });
    
                // Unityに全データを送信
                if (window.unityInstance) {
                    const allData = {
                        statusData: userDataResult.statusData,
                        rankingData: rankingList,
                        appVersion: versionInfo ? versionInfo.version : '',
                        source: userDataResult.source // FirebaseからかLocalStorageからかを伝える
                    };
                    window.unityInstance.SendMessage('FirestoreConnection', 'OnAllDataLoadComplete', JSON.stringify(allData));
                }
            })
            .catch(error => {
                console.error("一括データ読み込み中にエラーが発生しました:", error);
                // エラーの場合もUnityに通知
                if (window.unityInstance) {
                    const allData = {
                        statusData: null,
                        rankingData: [],
                        appVersion: '',
                        source: 'error'
                    };
                    window.unityInstance.SendMessage('FirestoreConnection', 'OnAllDataLoadComplete', JSON.stringify(allData));
                }
            });
        };

        /**
         * Firebase認証状態監視を設定
         */
        function setupAuthStateListener() {
            console.log("🔍 Firebase認証状態監視を設定");
            
            onAuthStateChanged(window.auth, async (user) => {
                if (user) {
                    console.log("✅ onAuthStateChanged: 認証済みユーザーを検出", user.uid);
                    console.log("   メール:", user.email);
                    console.log("   表示名:", user.displayName);
                    
                    // リロード後かどうかをチェック
                    const reloadFlag = localStorage.getItem('forceReloadInProgress');
                    if (reloadFlag === 'true') {
                        console.log("🔄 強制リロード後の認証状態復元を検出");
                        await handlePostReloadAuth(user); // await を追加
                    } else {
                        console.log("🆕 通常の認証状態変更を検出");
                        // 通常の認証プロセス（Unity側に送信）
                        if (window.unityInstance) {
                            const processedPhotoURL = await processPhotoURLForUnity(user.photoURL); // ここを修正
                            const authInfo = {
                                userId: user.uid,
                                email: user.email,
                                displayName: user.displayName,
                                photoURL: processedPhotoURL, // 処理済みのURLを使用
                                authMethod: user.providerData[0]?.providerId || "unknown",
                                isGuest: user.isAnonymous,
                                authenticatedAt: new Date().toISOString()
                            };
                            window.unityInstance.SendMessage('AuthManager', 'OnAuthSuccess', JSON.stringify(authInfo));
                        }
                    }
                } else {
                    console.log("ℹ️ onAuthStateChanged: 未認証状態");
                    // リロードフラグをクリア（認証が失われた場合）
                    localStorage.removeItem('forceReloadInProgress');
                }
            });
        }

        /**
         * 強制リロード後の認証状態復元処理
         */
        async function handlePostReloadAuth(user) { // async を追加
            console.log("🔄 リロード後の自動データロード処理を開始");
            
            // リロードフラグをクリア
            localStorage.removeItem('forceReloadInProgress');
            
            // LocalStorageにデータがあるかチェック
            const accountKey = window.getAccountSpecificKey('statusData');
            const localData = localStorage.getItem(accountKey);
            
            if (localData) {
                console.log("💾 LocalStorageからデータを復元してゲーム開始");
                
                // Unity側に認証情報とデータを送信
                if (window.unityInstance) {
                    const processedPhotoURL = await processPhotoURLForUnity(user.photoURL); // ここを修正
                    const authInfo = {
                        userId: user.uid,
                        email: user.email,
                        displayName: user.displayName,
                        photoURL: processedPhotoURL, // 処理済みのURLを使用
                        authMethod: user.providerData[0]?.providerId || "unknown",
                        isGuest: user.isAnonymous,
                        authenticatedAt: new Date().toISOString()
                    };
                    
                    // 認証情報を送信
                    window.unityInstance.SendMessage('AuthManager', 'OnAuthSuccess', JSON.stringify(authInfo));
                    
                    console.log("✅ リロード後の自動復元完了");
                }
            } else {
                console.log("⚠️ LocalStorageにデータなし - 通常のデータロード処理に移行");
                
                // Unity側に認証情報を送信（通常フロー）
                if (window.unityInstance) {
                    const processedPhotoURL = await processPhotoURLForUnity(user.photoURL); // ここを修正
                    const authInfo = {
                        userId: user.uid,
                        email: user.email,
                        displayName: user.displayName,
                        photoURL: processedPhotoURL, // 処理済みのURLを使用
                        authMethod: user.providerData[0]?.providerId || "unknown",
                        isGuest: user.isAnonymous,
                        authenticatedAt: new Date().toISOString()
                    };
                    window.unityInstance.SendMessage('AuthManager', 'OnAuthSuccess', JSON.stringify(authInfo));
                }
            }
        }

        /**
         * Unity側からFirebase設定を受け取って初期化する関数
         * UnityのScriptableObjectから取得した設定値を使用
         */
        window.initializeFirebaseFromUnity = function() {
            addLog("=== Firebase初期化開始 ===");
            addLog("Unity側からのFirebase設定受信待ちを開始します。");
            // 設定完了は onFirebaseConfigLoaded で処理されるため、ここでは何もせず待機
        };

        /**
         * Unity側からFirebase設定が完了したときに呼び出されるコールバック
         */
        window.onFirebaseConfigLoaded = function() {
            addLog("Unity側からFirebase設定を受信完了。Firebase初期化を開始します。");

            // Firebase設定オブジェクトを作成
            const firebaseConfig = {
                apiKey: window.unityServiceToken,
                authDomain: window.unityAuthDomain,
                projectId: window.unityProjectCode,
                storageBucket: window.unityStorageBucket,
                messagingSenderId: window.unityMessagingSenderCode,
                appId: window.unityAppCode,
                databaseURL: window.unityDatabaseURL
            };

            addLog("Firebase設定オブジェクト作成完了");

            try {
                // Firebase初期化
                addLog("initializeApp開始...");
                window.app = initializeApp(firebaseConfig);
                addLog("✅ initializeApp完了");

                addLog("getAuth開始...");
                window.auth = getAuth(window.app);
                addLog("✅ getAuth完了");

                addLog("getFirestore開始...");
                window.db = getFirestore(window.app);
                addLog("✅ getFirestore完了");

                // 認証状態監視を開始
                addLog("認証状態監視を開始...");
                setupAuthStateListener();

                addLog("✅ Firebase初期化完了");
                addLog("認証システム準備完了");
            } catch (error) {
                addLog(`❌ Firebase初期化失敗: ${error.message}`);
                addLog(`エラー詳細: ${error.stack}`);
            }
        };

        /**
         * Unityから呼び出される統合データ保存関数
         * ユーザデータとランキングデータをまとめて保存 (Batched Write)
         */
        window.saveCombinedDataToFBFromUnity = async function(combinedDataJson) {
            console.log("saveCombinedDataToFBFromUnity: 統合データを保存開始");

            try {
                if (!window.app || !window.auth || !window.db) {
                    console.error("❌ Firebase SDKが読み込まれていません");
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'error');
                    }
                    return;
                }

                const db = window.db;
                const user = window.auth.currentUser;

                if (!user) {
                    console.error("❌ ユーザーが認証されていません");
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'error');
                    }
                    return;
                }

                const combinedData = JSON.parse(combinedDataJson);
                console.log("保存データ:", combinedData);

                // バッチ処理の開始
                const batch = writeBatch(db);

                // 1. ユーザーデータの保存
                if (combinedData.statusData) {
                    const userDocRef = doc(db, 'users', user.uid);
                    batch.set(userDocRef, {
                        data: JSON.parse(combinedData.statusData),
                        updatedAt: serverTimestamp()
                    }, { merge: true });
                    console.log("Batch: ユーザーデータをセット");
                }

                // 2. ランキングデータの保存
                if (combinedData.rankingData && combinedData.rankingData.length > 0) {
                    // 配列の最初の要素（自分自身）を使用
                    const myRankData = combinedData.rankingData[0];
                    if (myRankData) {
                         const rankingDocRef = doc(db, 'rankings', user.uid);
                         batch.set(rankingDocRef, myRankData, { merge: true });
                         console.log("Batch: ランキングデータをセット");
                    }
                }

                // バッチコミット
                await batch.commit();
                console.log("✅ Firestoreに統合データを一括保存完了 (Batch)");
                
                // LocalStorageにも保存 (Ranking)
                if (combinedData.rankingData) {
                    const rankingAccountKey = window.getAccountSpecificKey('rankingData');
                    localStorage.setItem(rankingAccountKey, JSON.stringify(combinedData.rankingData));
                }

                if (window.unityInstance) {
                    window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'success');
                }

            } catch (error) {
                console.error("❌ saveCombinedDataToFBFromUnityでエラーが発生:", error);
                if (window.unityInstance) {
                    window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'error');
                }
            }
        };

        /**
         * Unityから呼び出されるFirestore保存関数
         * Unityから受け取ったデータをFirestoreに保存
         */
        window.saveToFirestoreFromUnity = function(data) {
            console.log("saveToFirestoreFromUnity: Firebaseにデータを保存開始", data);
            
            try {
                // Firebase SDKの読み込み状態をチェック
                if (!window.app || !window.auth) {
                    console.error("❌ Firebase SDKが読み込まれていません");
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'error');
                    }
                    return;
                }
                
                // Firebase SDKを使用してFirestoreに書き込み
                const db = window.db;
                const user = window.auth.currentUser;
                
                if (user) {
                    console.log("認証済みユーザー:", user.uid);
                    
                    // データの存在チェック
                    const userDocRef = doc(db, 'users', user.uid);
                    getDoc(userDocRef)
                    .then((docSnapshot) => {
                        if (docSnapshot.exists()) {
                            console.log("既存データを上書きします");
                            // 既存データがある場合は上書き
                            return setDoc(userDocRef, {
                                data: JSON.parse(data),
                                updatedAt: serverTimestamp()
                            });
                        } else {
                            console.log("新規データとして登録します");
                            // データがない場合は新規登録
                            return setDoc(userDocRef, {
                                data: JSON.parse(data),
                                createdAt: serverTimestamp(),
                                updatedAt: serverTimestamp()
                            });
                        }
                    })
                    .then(() => {
                        console.log("✅ Firestoreにデータを保存完了");
                        // Unity側に成功を通知
                        if (window.unityInstance) {
                            window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'success');
                        }
                    })
                    .catch((error) => {
                        console.error("❌ Firestore保存エラー:", error);
                        // Unity側にエラーを通知
                        if (window.unityInstance) {
                            window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'error');
                        }
                    });
                } else {
                    console.error("❌ ユーザーが認証されていません");
                    // Unity側にエラーを通知
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'error');
                    }
                }
            } catch (error) {
                console.error("❌ saveToFirestoreFromUnityでエラーが発生:", error);
                // Unity側にエラーを通知
                if (window.unityInstance) {
                    window.unityInstance.SendMessage('FirestoreConnection', 'OnSaveComplete', 'error');
                }
            }
        };

        /**
         * Unityから呼び出されるFirestoreデータロード関数
         * 現在認証されているユーザーのデータをFirestoreから取得
         * @returns {Promise<Object>} Firestoreから読み込まれたデータとロード元を示すフラグ
         */
        window.loadFirestoreUserData = function() {
            return new Promise((resolve, reject) => {
                console.log("Firestoreデータロード開始");
                
                if (!window.app || !window.auth || !window.db) {
                    console.error("Firebaseが初期化されていません");
                    reject({ error: "Firebaseが初期化されていません", source: 'firebase' });
                    return;
                }
                
                const user = window.auth.currentUser;
                if (!user) {
                    console.error("ユーザーが認証されていません");
                    reject({ error: "ユーザーが認証されていません", source: 'firebase' });
                    return;
                }
                
                console.log(`Firestoreデータロード開始: ${user.uid}`);
                
                const userDocRef = doc(window.db, 'users', user.uid);
                getDoc(userDocRef)
                .then((docSnapshot) => {
                    const result = { statusData: null, rankingData: null, source: 'firebase' }; // ロード元がFirebaseであることを示すフラグ
                    if (docSnapshot.exists()) {
                        const userData = docSnapshot.data();
                        console.log("✅ 既存ユーザー: Firestoreからデータを取得:", userData);
                        
                        if (userData.data) {
                            // LocalStorageに自動保存（リロード後の高速起動用）
                            const accountKey = window.getAccountSpecificKey('statusData');
                            localStorage.setItem(accountKey, JSON.stringify(userData.data));
                            console.log("💾 FirestoreデータをLocalStorageに自動保存:", accountKey);
                            result.statusData = userData.data;
                        } else {
                            console.log("🆕 新規ユーザー: データ構造が未初期化 - 空データで解決");
                        }
                    } else {
                        console.log("🆕 新規ユーザー: ユーザーデータ未作成 - 空データで解決");
                    }
                    resolve(result);
                })
                .catch((error) => {
                    console.error("🆕 新規ユーザー: Firestoreアクセスエラー（権限未設定の可能性） - 空データで解決:", error);
                    resolve({ statusData: null, rankingData: null, source: 'firebase', error: error }); // エラー時もresolveして処理続行
                });
            });
        };

        /**
         * Unityから呼び出されるランキングデータ取得関数
         * Firestoreからランキングデータを取得
         * @returns {Promise<Array<Object>>} ランキングデータの配列
         */
        window.getNecoRank = function() {
            return new Promise(async (resolve, reject) => {
                console.log("ランキングデータロード開始");
                
                if (!window.db) {
                    console.error("Firestoreが初期化されていません");
                    reject([]);
                    return;
                }
                
                const user = window.auth.currentUser;
                if (!user) {
                    console.error("ユーザーが認証されていません。ランキングデータを取得できません。");
                    resolve([]);
                    return;
                }

                try {
                    // まず、現在のユーザーのKPMとステージを取得
                    const userDocRef = doc(window.db, 'users', user.uid);
                    const userDoc = await getDoc(userDocRef);
                    let currentUserKpm = 0;
                    let currentUserStage = 0;

                    if (userDoc.exists() && userDoc.data() && userDoc.data().data && userDoc.data().data.Status) {
                        // SaveData.cs の st.Kpm (3) と st.Server (1) に対応
                        currentUserKpm = userDoc.data().data.Status[3] || 0; 
                        currentUserStage = userDoc.data().data.Status[1] || 0; 
                        console.log(`現在のユーザーKPM: ${currentUserKpm}, ステージ: ${currentUserStage}`);
                    } else {
                        console.warn("ユーザーKPMまたはステージ情報が見つかりません。デフォルト値を使用します。");
                    }

                    // 新規ユーザー（ステージ0）の場合は、ランキングデータをフェッチしない
                    if (currentUserStage === 0) {
                        console.log("新規ユーザー（ステージ0）のため、ランキングデータを取得せず空リストを返します。");
                        localStorage.setItem(window.getAccountSpecificKey('rankingData'), JSON.stringify([]));
                        resolve([]);
                        return;
                    }

                    // rankings コレクションから、同じステージのユーザーをKPM降順で150人取得
                    const rankingsRef = collection(window.db, 'rankings');
                    // ステージが0の場合はKPMが最も高いユーザー150人を対象とする
                    let q;
                    if (currentUserStage === 0) {
                        console.log("ステージ0のため、全ユーザーからKPM上位150人を取得します。");
                        q = query(rankingsRef, orderBy('Kpm', 'desc'), limit(150));
                    } else {
                        console.log(`ステージ ${currentUserStage} のユーザーをKPM降順で150人取得します。`);
                        q = query(rankingsRef, where('Stage', '==', currentUserStage), orderBy('Kpm', 'desc'), limit(150));
                    }
                    
                    const querySnapshot = await getDocs(q);
                    const rankingList = [];
                    
                    querySnapshot.forEach((doc) => {
                        const rankData = doc.data();
                        rankingList.push({
                            Uid: rankData.Uid || "",
                            Ranking: rankData.Ranking || 0, // 取得した順位を使用（FireFunctionで計算されることを想定）
                            FirstName: rankData.FirstName || "",
                            RightHand: rankData.RightHand || 0,
                            Glasses: rankData.Glasses || 0,
                            Head: rankData.Head || 0,
                            LeftHand: rankData.LeftHand || 0,
                            CatBody: rankData.CatBody || 0,
                            CatFace: rankData.CatFace || 0,
                            NicknameNo: rankData.NicknameNo || 0,
                            Kpm: rankData.Kpm || 0
                        });
                    });
                    
                    // LocalStorageに自動保存
                    const rankingAccountKey = window.getAccountSpecificKey('rankingData');
                    localStorage.setItem(rankingAccountKey, JSON.stringify(rankingList));
                    console.log("💾 FirestoreランキングデータをLocalStorageに自動保存:", rankingAccountKey);
                    
                    console.log("✅ ランキングデータ取得成功:", rankingList);
                    resolve(rankingList);
                    
                } catch (error) {
                    console.error("ランキングデータ取得中にエラーが発生:", error);
                    reject([]);
                }
            });
        };

        /**
         * Unityから呼び出されるランキングデータ保存関数
         * Unityから受け取った単一のランキングデータをFirestoreに保存
         */
        window.saveFirestoreRankingDataFromUnity = async function(rankingDataJson) {
            console.log("saveFirestoreRankingDataFromUnity: ランキングデータを保存開始", rankingDataJson);

            try {
                if (!window.app || !window.auth || !window.db) {
                    console.error("❌ Firebase SDKが読み込まれていません");
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('FirestoreConnection', 'OnRankingSaveComplete', 'error');
                    }
                    return;
                }

                const db = window.db;
                const user = window.auth.currentUser;

                if (user) {
                    const userRankingData = JSON.parse(rankingDataJson); // 単一のExRankオブジェクトをパース
                    // rankings コレクションに保存（UIDをドキュメントIDとして使用）
                    const rankingDocRef = doc(db, 'rankings', user.uid);

                    // LocalStorageに保存
                    const rankingAccountKey = window.getAccountSpecificKey('rankingData');
                    localStorage.setItem(rankingAccountKey, JSON.stringify([userRankingData])); // 配列として保存
                    console.log("💾 LocalStorageにランキングデータを保存:", rankingAccountKey);

                    // Firestoreに保存
                    await setDoc(rankingDocRef, userRankingData, { merge: true });
                    console.log("✅ Firestoreにランキングデータを保存完了:", user.uid);

                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('FirestoreConnection', 'OnRankingSaveComplete', 'success');
                    }
                } else {
                    console.error("❌ ユーザーが認証されていません。ランキングデータを保存できません。");
                    if (window.unityInstance) {
                        window.unityInstance.SendMessage('FirestoreConnection', 'OnRankingSaveComplete', 'error');
                    }
                }
            } catch (error) {
                console.error("❌ saveFirestoreRankingDataFromUnityでエラーが発生:", error);
                if (window.unityInstance) {
                    window.unityInstance.SendMessage('FirestoreConnection', 'OnRankingSaveComplete', 'error');
                }
            }
        };
